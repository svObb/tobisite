name: tobisite

# У драйвера json-file нет ротации по умолчанию: без этих опций логи растут,
# пока не кончится диск. У journald, из-под которого бот жил раньше, ротация
# была из коробки — здесь её нужно задать руками.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # мажорная версия совпадает с той, что была на хосте: pg_restore не примет
    # дамп, снятый более новым сервером
    image: postgres:16
    container_name: tobisite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tobisite
      POSTGRES_DB: tobisite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD в .env}
    volumes:
      - tobisite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobisite -d tobisite"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    # ports наружу нет намеренно: база доступна только боту по внутренней сети
    # compose, а с хоста — через docker compose exec

  bot:
    image: ghcr.io/svobb/tobisite:${IMAGE_TAG:?не задан IMAGE_TAG в .env}
    container_name: tobisite-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # пароль задан ровно один раз, в POSTGRES_PASSWORD; environment
      # перекрывает env_file, поэтому старая строка DATABASE_URL из .env
      # ни на что не влияет
      DATABASE_URL: postgresql+asyncpg://tobisite:${POSTGRES_PASSWORD}@db:5432/tobisite
      # лог только в stdout: файл внутри контейнера некуда писать и незачем
      LOG_FILE: ''
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # то, что раньше давали ProtectSystem=strict и NoNewPrivileges в юните
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Панель и туннель включаются только с COMPOSE_PROFILES=admin в .env:
  # обычный `docker compose up -d` их не видит. Интерполяция общефайловая,
  # поэтому здесь нельзя ${VAR:?…} — без переменных упал бы и выкат бота.
  admin:
    image: ghcr.io/svobb/tobisite:${IMAGE_TAG:-}
    container_name: tobisite-admin
    profiles: ["admin"]
    restart: unless-stopped
    command: ["uvicorn", "admin.app:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file:
      - .env
    environment:
      # панель ходит в базу только на чтение; тем же URL перекрыта и DATABASE_URL,
      # которую читает config бота при импорте моделей — писать ей нечем
      ADMIN_DATABASE_URL: postgresql+asyncpg://admin_ro:${ADMIN_DB_PASSWORD:-}@db:5432/tobisite
      DATABASE_URL: postgresql+asyncpg://admin_ro:${ADMIN_DB_PASSWORD:-}@db:5432/tobisite
      LOG_FILE: ''
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # те же ужесточения, что у бота
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ports нет: наружу панель выходит только через cloudflared

  cloudflared:
    # latest — только на первый запуск; после первого pull зафиксировать
    # конкретный тег в CLOUDFLARED_TAG (см. admin/README.md)
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    container_name: tobisite-cloudflared
    profiles: ["admin"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - admin
    logging: *logging
    security_opt:
      - no-new-privileges:true

volumes:
  tobisite-pgdata:
