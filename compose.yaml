name: qdif

# У драйвера json-file нет ротации по умолчанию: без этих опций логи растут,
# пока не кончится диск. У journald, из-под которого бот жил раньше, ротация
# была из коробки — здесь её нужно задать руками.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # мажорная версия совпадает с той, что была на хосте: pg_restore не примет
    # дамп, снятый более новым сервером
    image: postgres:16
    container_name: qdif-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qdif
      POSTGRES_DB: qdif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD в .env}
    volumes:
      - qdif-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qdif -d qdif"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    # ports наружу нет намеренно: база доступна только боту по внутренней сети
    # compose, а с хоста — через docker compose exec

  bot:
    image: ghcr.io/svobb/qdif-handler:${IMAGE_TAG:?не задан IMAGE_TAG в .env}
    container_name: qdif-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # пароль задан ровно один раз, в POSTGRES_PASSWORD; environment
      # перекрывает env_file, поэтому старая строка DATABASE_URL из .env
      # ни на что не влияет
      DATABASE_URL: postgresql+asyncpg://qdif:${POSTGRES_PASSWORD}@db:5432/qdif
      # лог только в stdout: файл внутри контейнера некуда писать и незачем
      LOG_FILE: ''
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # то, что раньше давали ProtectSystem=strict и NoNewPrivileges в юните
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  qdif-pgdata:
