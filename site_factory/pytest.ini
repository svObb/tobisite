# Свой ini у пакета — не прихоть. Он делает site_factory/ корнем прогона, и
# conftest.py бота (он поднимает схему в тестовой БД) в сбор не попадает:
# тесты фабрики не касаются ни базы, ни сети, ни Docker.
#
#     python -m pytest site_factory/tests -q
#
# На прогон бота это не влияет: у него свой pytest.ini в корне репозитория
# с testpaths = tests, и site_factory он не собирает.
[pytest]
testpaths = tests
