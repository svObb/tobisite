  dental: dental

  автосервис: auto_service
  автосервіс: auto_service
  сто: auto_service
  автомастерская: auto_service
  автомайстерня: auto_service
  auto service: auto_service
  car service: auto_service
  car repair: auto_service

  кафе/ресторан: cafe
  кафе: cafe
  ресторан: cafe
  кав'ярня: cafe
  кофейня: cafe
  cafe: cafe
  restaurant: cafe
  coffee shop: cafe

  салон красоты: beauty
  салон краси: beauty
  парикмахерская: beauty
  перукарня: beauty
  барбершоп: beauty
  beauty salon: beauty
  hair salon: beauty
  barbershop: beauty

  гостиница: hotel
  готель: hotel
  отель: hotel
  hotel: hotel
  guest house: hotel

  строительство: construction
  будівництво: construction
  строительная компания: construction
  будівельна компанія: construction
  construction: construction

pools:
  lawyer: [corporate-trust]
  dental: [clinical-light, editorial-warm, warm-table, friendly-pop]
  auto_service: [bold-trade, friendly-pop, clinical-light, corporate-trust]
  cafe: [deep-premium, warm-table, editorial-warm, friendly-pop]
  beauty: [editorial-warm, salon-monochrome, deep-premium]
  hotel: [editorial-warm, deep-premium, warm-table, salon-monochrome]
  construction: [editorial-warm, bold-trade, corporate-trust]
