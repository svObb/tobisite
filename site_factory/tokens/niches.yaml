# Ниша лида -> ключ рецепта и пул пресетов. Загружает engine/niches.py.
#
# aliases: слово, которым нишу называет работник (или карточка лида), в нижнем
# регистре -> ключ. Слова вне таблицы остаются собой: рецепта под них нет, их
# обслуживает generic, а пресет берётся из всего списка presets.yaml.
#
# pools: ключ ниши -> пресеты, которыми эта ниша вообще может быть собрана.
# Семь ниш бота (config.NICHES) собраны из matches архетипов дизайн-библиотеки
# (tobisite-launch/design-library/archetypes/arch-01..16): сначала архетипы,
# где ниша primary, затем alt, внутри — по номеру архетипа.
#
# Ниши-заготовки ниже (slug правила из design-library/niche-rules) собраны из
# archetype_affinity их правил, таблица — handoff-stage2.md §3. Пул у ниши
# один, а привязка в правиле раздельная по трекам rich/light, поэтому здесь
# треки слиты: primary rich, primary light, затем alt обоих треков. Трек всё
# равно выбирает рецепт (render.track_for), а не пресет.
#
# ПОРЯДОК ПУЛА — ЧАСТЬ КОНТРАКТА. Внутри пула пресет выбирается как
# sha256(domain_norm) % len(pool), поэтому перестановка меняет дизайн лидам,
# с которыми уже идёт переписка. Дописывать — только в конец пула. Пересборка
# пулов бота на arch-09..16 контракт не тронула: все восемь новых архетипов
# приходят в matches как alt и встают за существующими.
#
# Пулы намеренно узкие: ниша решает, каким сайт вообще может быть, домен —
# каким он будет.
#
# schema_types: ключ ниши -> тип schema.org для JSON-LD страницы
# (base/schema_localbusiness.j2). Здесь только ниши, у которых свой тип у
# schema.org есть; остальные остаются с типом рецепта (LocalBusiness) — общий
# тип честнее близкого по смыслу. Ключи обязаны быть нишами из pools, это
# проверяет engine/niches.

