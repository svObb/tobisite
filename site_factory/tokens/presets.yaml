# Токен-пресеты site_factory (13-шаблоны-сайтов.md §2, этап-5 подэтап 5.1).
#
# Источник — архетипы дизайн-библиотеки tobisite-launch/design-library/archetypes/:
# paper/ink/accent, шрифтовая пара, radius_px и density скопированы оттуда
# побайтово. Всё остальное в этом файле — контракт рендера, архетипы его не знают.
#
# ПОРЯДОК СПИСКА presets — ЧАСТЬ КОНТРАКТА. Пул ниши (tokens/niches.yaml)
# перечисляет пресеты по id, а внутри пула движок берёт
# sha256(domain_norm) % len(pool) (§3 шаг 5), поэтому переставлять и удалять
# пресеты нельзя: тот же лид получит другой дизайн посреди переписки.
# Новые пресеты — только в конец списка.
#
# Контракт цвета (его проверяет engine/checks/a11y.py):
#   paper       — фон страницы
#   ink         — основной текст по paper
#   accent      — ТОЛЬКО декор: плашки, линейки, маркеры. Текста не несёт никогда.
#   accent_ink  — тот же тон, доведённый до контраста >= 4.5:1 по paper.
#                 Несёт текст: ссылки, надзаголовки, заливка кнопок.
#   accent_on   — текст поверх заливки accent_ink, контраст >= 4.5:1.
# Там, где акцент архетипа сам проходит AA, accent_ink равен accent. Тона
# пресетов 5-8 досчитаны engine/palette.py той же математикой, которой движок
# доводит до AA бренд-цвет лида, — двух правил для одного контраста нет.
# Производные тона (surface, line, muted) считает css/source.css через
# color-mix — отдельными полями не хранятся, чтобы не расходились.
#
# Шрифты: семейства резолвятся по реестру fonts ниже. gwfh_id — идентификатор
# в API google-webfonts-helper, по нему tools/fetch_fonts.py качает WOFF2-сабсеты
# latin + latin-ext + cyrillic. fonts.googleapis.com в HTML запрещён (§4, GDPR).
#
# Четыре токена разнообразия — type_scale, button, elevation, align — у пресета
# необязательны; пропущенный берётся из PRESET_DEFAULTS в engine/render.py
# (regular / fill / flat / left). Ниже выписаны только не-дефолтные значения.

version: 2

subsets: [latin, latin-ext, cyrillic]
weights: [400, 700]

fonts:
  Inter:
    gwfh_id: inter
    stack: "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
  Source Serif 4:
    gwfh_id: source-serif-4
    stack: "'Source Serif 4', Georgia, 'Times New Roman', serif"
  Playfair Display:
    gwfh_id: playfair-display
    stack: "'Playfair Display', Georgia, 'Times New Roman', serif"
  Oswald:
    gwfh_id: oswald
    stack: "'Oswald', 'Arial Narrow', Arial, sans-serif"
  Lora:
    gwfh_id: lora
    stack: "'Lora', Georgia, 'Times New Roman', serif"
  Manrope:
    gwfh_id: manrope
    stack: "'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif"
  Cormorant Garamond:
    gwfh_id: cormorant-garamond
    stack: "'Cormorant Garamond', Garamond, Georgia, 'Times New Roman', serif"

# density архетипа → вертикальный ритм. Значения в clamp(), поэтому мобильный
# отступ берётся сам и отдельного брейкпоинта не требует.
density_scale:
  airy:
    section_py: "clamp(3.5rem, 9vw, 6rem)"
    flow: "clamp(1.5rem, 4vw, 2.5rem)"
    measure: "62ch"
  regular:
    section_py: "clamp(2.75rem, 7vw, 4.5rem)"
    flow: "clamp(1.25rem, 3vw, 2rem)"
    measure: "68ch"
  compact:
    section_py: "clamp(2rem, 5vw, 3.25rem)"
    flow: "clamp(1rem, 2.2vw, 1.5rem)"
    measure: "72ch"

# Кегли заголовков и лида. Отдельно от density: плотность отвечает за воздух
# между секциями, шкала — за размер шрифта внутри них, и сочетаются они
# по-разному (плакатные заголовки в плотной вёрстке — это arch-05).
type_scale:
  compact:
    h1: "clamp(1.9rem, 4vw, 2.6rem)"
    h2: "clamp(1.3rem, 2.2vw, 1.6rem)"
    lede: "clamp(1rem, 1.4vw, 1.08rem)"
  regular:
    h1: "clamp(2.2rem, 5.2vw, 3.4rem)"
    h2: "clamp(1.45rem, 2.8vw, 1.95rem)"
    lede: "clamp(1.05rem, 1.7vw, 1.2rem)"
  display:
    h1: "clamp(2.6rem, 7vw, 4.6rem)"
    h2: "clamp(1.7rem, 3.6vw, 2.4rem)"
    lede: "clamp(1.1rem, 2vw, 1.35rem)"

# Тень карточек. Замешана на ink пресета, а не на чёрном: на тёмной бумаге
# чёрная тень не видна вовсе.
elevation_scale:
  flat: "none"
  raised: "0 1px 2px color-mix(in oklab, var(--ink) 10%, transparent), 0 10px 28px color-mix(in oklab, var(--ink) 10%, transparent)"

