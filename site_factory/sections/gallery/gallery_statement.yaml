# Один кадр во всю ширину и одна фраза поверх него. КРАСНОЕ правило проекта:
# большая картинка бывает либо фоном секции, либо живой — здесь она и то, и
# другое (js: parallax).
#
# Кадр берётся из пула самым широким (pool_pick), и только начиная с
# pool_min_width: снимок 600px, растянутый на ширину экрана, — не фон секции,
# а брак, и вариант честно выбывает по гейту вместо того, чтобы его показать.
#
# Потолок в requires — это разделение труда внутри роли, а не каприз: от трёх
# свободных кадров галерею собирает коллаж, и отдать ему один снимок под фон,
# а остальные не показать вовсе значило бы спрятать половину фотографий лида.
# Один-два кадра коллажу не набрать, и тогда единственный снимок работает
# здесь — во всю ширину, а не третью полосой.
id: gallery_statement
role: gallery
requires: {nonproduct_photo_count: "1..2"}
prefers: {photo_count: "4..", text_volume: ">=short"}
image_slots: 1
image_pool: free_photos
pool_pick: widest
pool_min_width: 900
js: parallax
slots:
  - {name: statement, type: free, max_chars: 64, lang: from_lead}
perf: {est_dom_nodes: 10, images: 1}
a11y: {heading_level: 2}
