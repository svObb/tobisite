# Полоса из трёх снимков лида во всю ширину страницы. Картинки приходят пулом,
# а не поимённо: снимки товаров стейджинг кладёт под теми же именами photo-N,
# и полоса по именам повторяла бы витрину, уже стоящую в товарной сетке.
# Пул свободных снимков считает engine/profile.free_photos.
id: gallery_strip
role: gallery
requires: {nonproduct_photo_count: ">=3"}
prefers: {photo_count: "4.."}
image_slots: 3
image_pool: free_photos
perf: {est_dom_nodes: 12, images: 1}
a11y: {heading_level: 0}
