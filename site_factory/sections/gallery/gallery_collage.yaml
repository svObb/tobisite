# Кладка из трёх-пяти снимков лида: крупный ведёт, мелкие идут за ним. Секция
# тянется, поэтому у неё порог и потолок врозь: image_slots — сколько кадров
# она покажет максимум, pool_min — без скольких не живёт (engine/photos).
# Пять кадров в пуле бывает реже трёх, и выбывать из-за этого коллажу незачем.
#
# Подпись необязательна и говорит о компании, а не о снимках: что именно на
# чужой фотографии, движок не знает, и придумывать подписи к кадрам нельзя. В
# кладку, добранную дорисованным кадром, подпись не печатается вовсе — слова о
# компании над не её кадром это выдуманное доказательство (engine/photos).
#
# Целиком на дорисованных кладка не стоит и стоять не может: без единого
# снимка лида галерее предлагается один кадр, порога не набирается, и роль
# уходит заявлению (engine/photos.offered).
#
# pool_leave: кладка стоит выше блока «о компании» и без этого забирала бы
# весь пул, оставляя ему абзац без единой фотографии. Свой порог она при этом
# держит: на трёх кадрах отдавать нечего.
id: gallery_collage
role: gallery
requires: {nonproduct_photo_count: ">=3"}
prefers: {nonproduct_photo_count: ">=3", photo_count: "4.."}
image_slots: 5
pool_min: 3
pool_leave: 1
image_pool: free_photos
slots:
  - {name: caption, type: free, max_chars: 90, lang: from_lead, optional: true}
perf: {est_dom_nodes: 22, images: 1}
a11y: {heading_level: 0}
