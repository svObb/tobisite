# Шапка без логотипа: название компании, набранное display-шрифтом пресета.
# Это фолбэк роли header, поэтому требований у него ровно столько, сколько уже
# требует футер, — иначе шапка выбивала бы страницу целиком.
id: header_wordmark
role: header
requires: {has_phone: true}
prefers: {has_logo: false}
image_slots: 0
slots:
  - {name: business_name, type: fact, source: whitelist, max_chars: 60}
  - {name: phone, type: fact, source: whitelist, max_chars: 24}
  - {name: phone_href, type: fact, source: whitelist, max_chars: 32}
perf: {est_dom_nodes: 6, images: 0}
a11y: {heading_level: 0}
