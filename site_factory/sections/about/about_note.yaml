# Абзац о компании. Единственная секция, где текст длиннее строки, поэтому
# рядом с ним стоят два факта из белого списка — название и адрес: читатель
# видит, о ком речь, а не только слова.
id: about_note
role: about
requires: {has_address: true}
prefers: {text_volume: ">=medium", has_hours: true}
image_slots: 0
slots:
  - {name: section_title, type: free, max_chars: 42, lang: from_lead}
  - {name: about_text, type: free, max_chars: 260, lang: from_lead}
  - {name: company_label, type: free, max_chars: 20, lang: from_lead}
  - {name: business_name, type: fact, source: whitelist, max_chars: 60}
  - {name: address_label, type: free, max_chars: 20, lang: from_lead}
  - {name: address, type: fact, source: whitelist, max_chars: 120}
perf: {est_dom_nodes: 14, images: 0}
a11y: {heading_level: 2}
