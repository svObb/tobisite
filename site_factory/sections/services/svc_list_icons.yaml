id: svc_list_icons
role: services
requires: {service_count: ">=2"}
prefers: {service_count: "4..10", text_volume: ">=medium"}
image_slots: 0
slots:
  - {name: section_title, type: free, max_chars: 42, lang: from_lead}
  # repeat-слоты с общим group движок кладёт одним списком: s.services[].name / .blurb
  - {name: service_name, type: fact, source: whitelist, group: services, repeat: 2..10, max_chars: 40}
  - {name: service_blurb, type: free, group: services, repeat: same_as_group, max_chars: 130, lang: from_lead}
perf: {est_dom_nodes: 64, images: 0}
a11y: {heading_level: 2}
