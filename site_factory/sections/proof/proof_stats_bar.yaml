# Значения stat_value приходят через белый список профиля (§3 ступень 2) —
# из карточки лида или из разметки его сайта. Ни одна цифра здесь не может быть
# написана моделью: показателя нет в профиле — вариант отсеивается гейтом.
id: proof_stats_bar
role: proof
requires: {proof_stats_count: ">=2"}
prefers: {review_count: ">=10", google_rating: ">=4.0"}
image_slots: 0
slots:
  - {name: section_title, type: free, max_chars: 32, lang: from_lead}
  # repeat-слоты с общим group движок кладёт одним списком: s.stats[].value / .label
  - {name: stat_value, type: fact, source: whitelist, group: stats, repeat: 2..4, max_chars: 12}
  - {name: stat_label, type: free, group: stats, repeat: same_as_group, max_chars: 28, lang: from_lead}
  # Подпись называет происхождение цифр, а оно зависит от того, откуда пришла
  # оценка (карточка Google или разметка сайта лида), — поэтому это факт, а не
  # текст модели. Источника нет — подписи нет, полоса остаётся без неё.
  - {name: rating_source_note, type: fact, source: whitelist, max_chars: 64, optional: true}
perf: {est_dom_nodes: 26, images: 0}
a11y: {heading_level: 2}
