# Рецепт: ниша вне покрытия, трек light (фото меньше трёх или неизвестно).
# Правила файла — см. комментарий в lawyer_rich.yaml.

id: generic_light
version: 1
niche: generic
track: light
schema_type: LocalBusiness

min_sections: 4
roles_order: [hero, services, proof, cta, footer]
optional_roles: [proof]
role_substitutes:
  services: [proof]

downgrade_ladder:
  hero: [hero_split_map, hero_type_only, hero_photo_left]
  services: [svc_list_icons, svc_cards_3]
  proof: [proof_stats_bar]
  cta: [cta_form_short]
  footer: [footer_nap]

niche_affinity:
  hero_split_map: 0.8
  hero_type_only: 0.7
  hero_photo_left: 0.4
  svc_list_icons: 0.8
  svc_cards_3: 0.6
  proof_stats_bar: 0.7
  cta_form_short: 1.0
  footer_nap: 1.0

