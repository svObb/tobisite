  name: "Нужно название компании ровно так, как оно в карточке."
  phone: "Нужен телефон — без него не собрать ни шапку, ни первый экран, ни форму заявки."
  address: "Нужен адрес: улица, дом, город — он идёт в футер и в карточку."
  services: "Нужен перечень услуг: минимум 2 позиции словами клиента."
  products: "Нужны товары: название, цена и фото — так, как они стоят у клиента."
  hours: "Нужны часы работы — строкой, как их указывает клиент."
  photo_count: "Нужно минимум 3 фото (интерьер, команда, работа) или ссылка на альбом."
  images: "Нужны картинки с сайта клиента: логотип для шапки и минимум 3 фото."
  proof_stats: "Нужны рейтинг и число отзывов из Google Maps."
  lang: "Нужен язык лида — на нём собирается весь текст черновика."
  _fallback: "Данных для черновика не хватает: пройдите карточку лида ещё раз."

