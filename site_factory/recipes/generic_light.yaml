# Рецепт: ниша вне покрытия, трек light (фото меньше трёх или неизвестно).
# Правила файла — см. комментарий в lawyer_rich.yaml.

id: generic_light
version: 3
niche: generic
track: light
schema_type: LocalBusiness

min_sections: 4
roles_order: [header, hero, products, services, gallery, proof, about, info, cta, footer]
optional_roles: [products, gallery, proof, about, info]
role_substitutes:
  services: [products, proof, about]
  products: [services]

downgrade_ladder:
  header: [header_logo, header_wordmark]
  hero: [hero_split_map, hero_bg_photo, hero_type_only, hero_photo_left]
  products: [products_list, products_grid, product_carousel]
  services: [svc_list_icons, svc_two_col_rule, svc_cards_3]
  gallery: [gallery_statement, gallery_collage, gallery_strip]
  proof: [proof_stats_bar]
  about: [about_photo_split, about_note]
  info: [info_hours_card]
  cta: [cta_form_short]
  footer: [footer_nap]

niche_affinity:
  header_logo: 1.0
  header_wordmark: 0.5
  hero_split_map: 0.85
  hero_bg_photo: 0.75
  hero_type_only: 0.7
  hero_photo_left: 0.4
  products_list: 0.8
  products_grid: 0.8
  product_carousel: 0.7
  svc_list_icons: 0.8
  svc_two_col_rule: 0.7
  svc_cards_3: 0.6
  gallery_statement: 1.0
  gallery_collage: 0.85
  gallery_strip: 0.7
  proof_stats_bar: 0.7
  about_photo_split: 1.0
  about_note: 0.7
  info_hours_card: 0.9
  cta_form_short: 1.0
  footer_nap: 1.0

