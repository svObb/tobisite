# Рецепт: ниша вне покрытия, трек rich (photo_count >= 3).
# Тексты нейтральные: ниша известна движку словом, но в слоты она не попадает —
# черновик описывает страницу, а не бизнес, о котором мы ничего не знаем.
# Правила файла — см. комментарий в lawyer_rich.yaml.

id: generic_rich
version: 2
niche: generic
track: rich
schema_type: LocalBusiness

min_sections: 5
roles_order: [header, hero, products, services, gallery, proof, about, info, cta, footer]
optional_roles: [products, gallery, proof, about, info]
role_substitutes:
  services: [products, proof, about]
  products: [services]

downgrade_ladder:
  header: [header_logo, header_wordmark]
  hero: [hero_bg_photo, hero_photo_left, hero_split_map, hero_type_only]
  products: [products_grid, products_list]
  services: [svc_cards_3, svc_two_col_rule, svc_list_icons]
  gallery: [gallery_strip]
  proof: [proof_stats_bar]
  about: [about_note]
  info: [info_hours_card]
  cta: [cta_form_short]
  footer: [footer_nap]

# Товарные и галерейные варианты подняты сознательно: у них perf.images = 1,
# и без запаса по весу секция с картинками проигрывает текстовой всегда.
niche_affinity:
  header_logo: 1.0
  header_wordmark: 0.5
  hero_bg_photo: 1.0
  hero_photo_left: 0.8
  hero_split_map: 0.6
  hero_type_only: 0.35
  products_grid: 1.0
  products_list: 0.6
  svc_cards_3: 0.8
  svc_two_col_rule: 0.7
  svc_list_icons: 0.6
  gallery_strip: 0.9
  proof_stats_bar: 0.6
  about_note: 0.7
  info_hours_card: 0.9
  cta_form_short: 1.0
  footer_nap: 1.0

enrichment_hints:
  name: "Нужно название компании ровно так, как оно в карточке."
  phone: "Нужен телефон — без него не собрать ни шапку, ни первый экран, ни форму заявки."
  address: "Нужен адрес: улица, дом, город — он идёт в футер и в карточку."
  services: "Нужен перечень услуг: минимум 2 позиции словами клиента."
  products: "Нужны товары: название, цена и фото — так, как они стоят у клиента."
  hours: "Нужны часы работы — строкой, как их указывает клиент."
  photo_count: "Нужно минимум 3 фото (интерьер, команда, работа) или ссылка на альбом."
  images: "Нужны картинки с сайта клиента: логотип для шапки и минимум 3 фото."
  proof_stats: "Нужны рейтинг и число отзывов из Google Maps."
  lang: "Нужен язык лида — на нём собирается весь текст черновика."
  _fallback: "Данных для черновика не хватает: пройдите карточку лида ещё раз."

