  address: "Нужен адрес: улица, дом, город — он идёт в футер и в карточку."
  services: "Нужен перечень услуг: минимум 2 направления работы словами клиента."
  hours: "Нужны часы приёма — строкой, как их указывает клиент."
  photo_count: "Нужно минимум 3 фото (команда, офис, работа) или ссылка на альбом."
  images: "Нужно минимум 3 фото (команда, офис, работа) или ссылка на альбом."
  proof_stats: "Нужны рейтинг и число отзывов из Google Maps."
  lang: "Нужен язык лида — на нём собирается весь текст черновика."
  _fallback: "Данных для черновика не хватает: пройдите карточку лида ещё раз."

