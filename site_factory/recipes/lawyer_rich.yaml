# Рецепт: юрист, трек rich (photo_count >= 3). См. engine/compose.py.
#
# Порядок downgrade_ladder и веса niche_affinity держатся согласованными:
# лестница читается сверху вниз, вес обязан убывать. Гейт снимает верхнюю
# ступень — следующая поднимается сама, без ветвлений в коде.
#
# free_defaults — заготовки MVP для слотов type: free (§2: слот-генерацию
# делает этап 6). Ключи внутри языка: _page — уровень страницы, _common —
# общее для всех вариантов, остальные — id варианта, они переопределяют общее.
# Ни одной цифры и ни одной превосходной степени здесь быть не может: цифры
# приходят только из профиля Google, а «лучший юрист города» мы не знаем.

id: lawyer_rich
version: 1
niche: lawyer
track: rich
schema_type: LegalService

min_sections: 4
roles_order: [hero, services, proof, cta, footer]
optional_roles: [proof]
role_substitutes:
  services: [proof]

downgrade_ladder:
  hero: [hero_photo_left, hero_split_map, hero_type_only]
  services: [svc_cards_3, svc_list_icons]
  proof: [proof_stats_bar]
  cta: [cta_form_short]
  footer: [footer_nap]

niche_affinity:
  hero_photo_left: 1.0
  hero_split_map: 0.6
  hero_type_only: 0.35
  svc_cards_3: 0.9
  svc_list_icons: 0.7
  proof_stats_bar: 0.6
  cta_form_short: 1.0
  footer_nap: 1.0

# Что просить у работника, если роль не собралась. Ключ — поле профиля из
# причины отказа; текст идёт в бот работнику, поэтому он на русском.
