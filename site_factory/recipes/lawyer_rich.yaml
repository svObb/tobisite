# Рецепт: юрист, трек rich (photo_count >= 3). См. engine/compose.py.
#
# Порядок downgrade_ladder и веса niche_affinity держатся согласованными:
# лестница читается сверху вниз, вес обязан убывать. Гейт снимает верхнюю
# ступень — следующая поднимается сама, без ветвлений в коде.
#
# free_defaults — заготовки MVP для слотов type: free (§2: слот-генерацию
# делает этап 6). Ключи внутри языка: _page — уровень страницы, _common —
# общее для всех вариантов, остальные — id варианта, они переопределяют общее.
# Ни одной цифры и ни одной превосходной степени здесь быть не может: цифры
# приходят только из профиля Google, а «лучший юрист города» мы не знаем.

id: lawyer_rich
version: 3
niche: lawyer
track: rich
schema_type: LegalService

min_sections: 5
roles_order: [header, hero, products, services, gallery, proof, about, info, cta, footer]
optional_roles: [products, gallery, proof, about, info]
role_substitutes:
  services: [products, proof, about]
  products: [services]

downgrade_ladder:
  header: [header_logo, header_wordmark]
  hero: [hero_photo_left, hero_bg_photo, hero_split_map, hero_type_only]
  products: [products_list, products_grid, product_carousel]
  services: [svc_two_col_rule, svc_cards_3, svc_list_icons]
  gallery: [gallery_statement, gallery_collage, gallery_strip]
  proof: [proof_stats_bar]
  about: [about_photo_split, about_note]
  info: [info_hours_card]
  cta: [cta_form_short]
  footer: [footer_nap]

niche_affinity:
  header_logo: 1.0
  header_wordmark: 0.5
  hero_photo_left: 1.0
  hero_bg_photo: 0.8
  hero_split_map: 0.6
  hero_type_only: 0.35
  products_list: 0.5
  products_grid: 0.4
  product_carousel: 0.3
  svc_two_col_rule: 0.9
  svc_cards_3: 0.8
  svc_list_icons: 0.7
  gallery_statement: 1.0
  gallery_collage: 0.85
  gallery_strip: 0.7
  proof_stats_bar: 0.6
  about_photo_split: 1.0
  about_note: 0.7
  info_hours_card: 0.9
  cta_form_short: 1.0
  footer_nap: 1.0

# Что просить у работника, если роль не собралась. Ключ — поле профиля из
# причины отказа; текст идёт в бот работнику, поэтому он на русском.
enrichment_hints:
  name: "Нужно название компании ровно так, как оно в карточке."
  phone: "Нужен телефон — без него не собрать ни шапку, ни первый экран, ни форму заявки."
  address: "Нужен адрес: улица, дом, город — он идёт в футер и в карточку."
  services: "Нужен перечень услуг: минимум 2 направления работы словами клиента."
  products: "Нужны позиции прайса: название и цена так, как их указывает клиент."
  hours: "Нужны часы приёма — строкой, как их указывает клиент."
  photo_count: "Нужно минимум 3 фото (команда, офис, работа) или ссылка на альбом."
  images: "Нужны картинки с сайта клиента: логотип для шапки и минимум 3 фото."
  proof_stats: "Нужны рейтинг и число отзывов из Google Maps."
  lang: "Нужен язык лида — на нём собирается весь текст черновика."
  _fallback: "Данных для черновика не хватает: пройдите карточку лида ещё раз."

