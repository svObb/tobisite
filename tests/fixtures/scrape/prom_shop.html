<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Високий Сервіс — ремонт побутової техніки у Вигаданську</title>
</head>
<body>
<header class="cs-header">
  <div class="cs-header-company-info">
    <!-- слово «логотип» есть только у ссылки-обёртки: так верстает конструктор -->
    <a class="cs-header-company-info__logo" href="/">
      <img class="cs-header-company-info__img"
           src="/images/6773692817_w200_h100_vysokyi-servis.jpg"
           alt="Високий Сервіс. Ремонт побутової техніки, Вигаданськ"></a>
    <span class="cs-header-company-info__name">Високий Сервіс</span>
  </div>
  <nav class="cs-header-nav">
    <a href="/catalog/"><img class="cs-icon" src="/icons/cart.svg" alt="Кошик"></a>
    <a href="/contacts/">Контакти</a>
  </nav>
</header>
<main>
  <img class="cs-banner" src="/images/banner-znyzhky-1200.jpg" alt="Знижки на ремонт">
  <h1>Ремонт побутової техніки</h1>
  <p>Майстерня на вулиці Вигаданій, 7. Дрібний ремонт робимо за день, складний — за три. Виїзд майстра по місту безкоштовний.</p>
  <section class="cs-goods">
    <div class="cs-goods-tile">
      <img src="/images/8812340001_w640_h640_pralna-mashyna.jpg" alt="Ремонт пральних машин">
      <h3>Ремонт пральних машин</h3>
    </div>
    <div class="cs-goods-tile">
      <img src="/images/8812340002_w640_h640_kholodylnyk.jpg" alt="Ремонт холодильників">
      <h3>Ремонт холодильників</h3>
    </div>
  </section>
</main>
<footer>
  <div class="logo-partners">
    <img src="/partners/acme.png" alt="Acme">
  </div>
</footer>
</body>
</html>
