# Конфигурация линтера (6.21). Набор минимальный и ровно тот, по которому код
# уже написан: ошибки Python (F — их же ловил pyflakes) плюс стиль pycodestyle
# (E, W). Расширять набор — отдельным решением и отдельной правкой кода, а не
# молча в CI: линтер, который валит сборку на вкусовщине, начинают обходить.
# Сортировка импортов (I) не включена: ruff умеет раскладывать их только
# по одному имени в строку, а здесь они собраны в блоки.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
# l — это lead, и так во всех списковых включениях по лидам. Переименование
# ради линтера тронуло бы выгрузку CSV и tools/ безо всякой пользы.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Строки системных промптов модели: перенос сменил бы то, что уходит в API,
# а промпт правится только вместе с PROMPT_VERSION.
"slot_gen.py" = ["E501"]
"scout/gate.py" = ["E501"]
"enrich_service.py" = ["E501"]
