# Каталог доп-услуг — файл-истина (раздел 16 плана, Приложение А MASTER-PLAN).
# Схема пункта 16.1; валидатор — services.py, падает на старте бота при ошибке.
#
# Поля:
#   id          — слаг, только [a-z0-9-]
#   name        — название для админа (бот русскоязычный)
#   status      — ready | pilot | idea. Продаём только ready; pilot — только
#                 дружественным клиентам с пометкой; idea не показывается (16.3)
#   cogs/price/margin — юнит-экономика из Приложения А, строки как есть
#   complexity  — low | mid | high (сколько нашей работы в услуге)
#   niches      — all или список из config.NICHES: где услуга применима.
#                 Список = фильтр И бонус за точное попадание в нишу
#   countries   — all или список названий стран из COUNTRIES (.env)
#   deps        — что должно существовать до продажи (id услуг или пункты плана)
#   triggers    — факты лида, поднимающие услугу в рекомендации:
#                 always      — универсальная, небольшой базовый балл
#                 has_ads     — лид уже платит за рекламу (сегмент Ads Transparency)
#                 no_website  — сайта нет
#                 has_website — сайт есть (можно улучшать/аудировать)
#   pitch_en/pitch_ua — одна фраза для письма клиенту; обязательна для
#                 ready и pilot, у idea может быть пустой

- id: missed-call-textback
  name: "Missed-call text-back: SMS звонившему после пропущенного звонка"
  status: pilot
  cogs: "~$6/мес (Twilio toll-free)"
  price: "$50–75/мес"
  margin: "85%+"
  complexity: mid
  niches: all
  countries: all
  deps: ["17.A"]
  triggers: [always, has_ads]
  pitch_en: "Every missed call is a lost customer. We text them back within seconds — 20 missed calls a month at a 25% close rate and a $300 ticket is $1,500 you stop losing."
  pitch_ua: "Кожен пропущений дзвінок — втрачений клієнт. Ми надсилаємо SMS за секунди: 20 пропущених на місяць × 25% × $300 — це $1 500, які ви перестаєте втрачати."

